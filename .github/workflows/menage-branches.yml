name: Menage des branches
# Supprime une fois les branches listees dans .github/menage-branches.txt (lance au fusionnement de ce fichier).
on:
  push:
    branches: [main]
    paths: ['.github/menage-branches.txt']
permissions:
  contents: write
jobs:
  menage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer les branches de la liste
        run: |
          while read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|captures/main) continue;; esac
            git push origin --delete "$b" || echo "deja absente : $b"
          done < .github/menage-branches.txt
