# Mises a jour automatiques : une seule demande groupee par mois, a relire avec le check-up (rien n'est fusionne tout seul).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      tout:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      tout:
        patterns: ["*"]
